name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-web.mjs
      - name: Vitest
        if: hashFiles('apps/web/vitest.config.ts') != ''
        run: npx vitest run
        working-directory: apps/web
      - name: npm audit (report only)
        run: npm audit --omit=dev || true

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aicmo
          POSTGRES_PASSWORD: aicmo_test_only
          POSTGRES_DB: aicmo_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aicmo" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term --cov-fail-under=85
      - run: pytest tests/test_ssrf.py tests/test_auth.py tests/test_profile_products_assets.py tests/test_route_guard.py tests/test_deps.py --cov=app.core.security --cov=app.core.deps --cov-fail-under=100
      - run: python scripts/migration_roundtrip.py
      - name: pip-audit (report only)
        run: pip-audit -r requirements.txt || true
