services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ai_cmo
      POSTGRES_PASSWORD: ai_cmo_pass
      POSTGRES_DB: ai_cmo
    ports:
      - "5434:5432"
    volumes:
      - ai_cmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_cmo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "9011:9001"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ai_cmo:ai_cmo_pass@db:5432/ai_cmo
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "9010:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ai_cmo_pgdata:
