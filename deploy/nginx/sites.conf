# 客户官网托管：按请求的 Host 选择 live/{host} 目录（发布时原子切换的软链接）。
# 与应用 API 隔离：只托管静态文件，唯一的动态入口是询盘表单 /__inquiry/{site_id} → api。

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # 真实客户端地址：只信任内部网络中的上游（生产为 Caddy，它会覆盖客户端伪造的转发头）。
    # 开发模式直接对外时没有可信上游，$realip_remote_addr 即连接地址。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    set $client_ip $remote_addr;
    # 使用 Docker 内置 DNS 解析 api（proxy_pass 中含变量时需要）
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 32k;
    disable_symlinks off;

    # Host 必须是严格的域名格式（每个标签 1–63 个字母数字或连字符，不能以连字符开头 / 结尾，至少两个标签）。
    # 拒绝 "."、".."、连续点等会让 live/$host 退回上级目录的值，防止越过 live/ 读取 versions/ 中的草稿与历史版本。
    if ($host !~* "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$") { return 444; }
    set $site_root /data/sites/live/$host;

    root $site_root;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 纵深防御：站点根目录之外的发布结构路径一律不可访问
    location ~ "^/(versions|live|\.)" {
        return 404;
    }

    location ~ "^/__inquiry/([0-9a-f-]{36})$" {
        limit_except POST { deny all; }
        proxy_pass http://api:8000/api/v1/public/sites/$1/inquiries;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. { deny all; }

    error_page 404 /404.html;
    location = /404.html { internal; return 404 "Not found"; }
}
