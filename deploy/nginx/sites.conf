# 客户官网托管：按请求的 Host 选择 live/{host} 目录（发布时原子切换的软链接）。
# 与应用 API 隔离：只托管静态文件，唯一的动态入口是询盘表单 /__inquiry/{site_id} → api。

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    # 使用 Docker 内置 DNS 解析 api（proxy_pass 中含变量时需要）
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 32k;
    disable_symlinks off;

    # Host 只允许合法域名字符，防止路径穿越（live 目录中只有发布时写入的域名链接）
    set $site_root /data/sites/live/$host;
    if ($host !~* "^[a-z0-9.-]+$") { return 444; }

    root $site_root;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location ~ "^/__inquiry/([0-9a-f-]{36})$" {
        limit_except POST { deny all; }
        proxy_pass http://api:8000/api/v1/public/sites/$1/inquiries;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. { deny all; }

    error_page 404 /404.html;
    location = /404.html { internal; return 404 "Not found"; }
}
