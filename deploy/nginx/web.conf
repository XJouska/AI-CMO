# 新版 Web：Nginx 托管 SPA，并把 /api/ 反向代理到 api 容器。
# 宿主机 Nginx（aicmo.site）保持不变；切换上线时再把流量指向本容器。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # 真实客户端地址：只信任内部网络中的上游（生产为 Caddy，它会覆盖客户端伪造的转发头）。
    # 开发模式直接对外时没有可信上游，$realip_remote_addr 即连接地址。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    set $client_ip $remote_addr;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # ── 安全响应头（所有响应）────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 内部接口（Caddy 证书签发 ask）只允许容器网络内直接访问 api，不经过公网入口
    location ^~ /api/v1/public/internal/ {
        return 404;
    }

    # 指标只在容器网络内抓取（api:8000/metrics，且需要 METRICS_TOKEN）
    location = /metrics {
        return 404;
    }

    # ── API 反向代理 ─────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE：关闭缓冲，延长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering "no" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    # ── 静态资源：带 hash 的文件长期缓存 ──────────────────
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA 回退；index.html 不缓存 ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # 隐藏文件一律拒绝
    location ~ /\. {
        deny all;
    }
}
