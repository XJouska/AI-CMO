[project]
name = "aicmo-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # 测试中使用 assert
  "RUF001", "RUF002", "RUF003",  # 中文全角标点
  "B008",   # FastAPI 依赖注入写法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311", "E501"]
# 迁移的遗留代码，计划 05 加固时移除这些豁免。
"app/services/browser.py" = ["SIM105", "S110", "E501", "S324"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/services/browser.py", "app/workers/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
